net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_mtu_probing = 1
# v63.5.1 体检优化 (B5/O1, 2026-09-11)：TCP 接收/发送缓冲上限。
#   原 2MB → 实测单流仅 21.7 Mbit/s；阶梯实验（同源、正向+反向双向复现）：
#     2MB=21.7 / 16MB=56.4 / 64MB=141.4 / 256MB=113.7 / 1GB=147.3 Mbit/s
#   → **拐点在 64MB**，再往上（256MB/1GB）无增益。
#   对照：多流 x6 @16MB 聚合已达 464 Mbit/s ⇒ 单流受限是缓冲造成，非链路。
#   64MB 单流上限 ≈ 13.8 Gbit/s @37ms RTT，远超本机 CAKE 整形上限(894M)，留足余量。
net.core.rmem_max = 67108864
net.core.wmem_max = 67108864
net.core.rmem_default = 262144
net.core.wmem_default = 262144
net.ipv4.tcp_rmem = 4096 131072 67108864
net.ipv4.tcp_wmem = 4096 65536 67108864
# 全局 TCP 内存上限（page, 1page=4KB）：low=256MB / pressure=512MB / max=1.5GB。
#   原值 (183/245/367MB) 只够 ~5 个 64MB socket，会先把窗口钳住；本机 3.9GB RAM、
#   tcp_moderate_rcvbuf=1（按需增长，不会无脑吃内存），设 1.5GB 上限兼顾吞吐与防 OOM。
net.ipv4.tcp_mem = 65536 131072 393216
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_ecn = 0
net.ipv4.tcp_notsent_lowat = 131072
net.ipv4.tcp_tw_reuse = 1
net.core.somaxconn = 1024
